# ─── docker-compose.dev.yml ───────────────────────────────────────────────────
# Development stack: hot reload, mounted source, console email, debug mode.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15
    container_name: backend_db_dev
    restart: unless-stopped
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7
    container_name: backend_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django backend — Django dev server with hot reload ──────────────────────
  backend:
    build:
      context: ./backend
      target: development
    container_name: backend_dev
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app                   # mount source for hot reload
      - static_volume_dev:/app/staticfiles
      - media_volume_dev:/app/media
    env_file:
      - .env.dev
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── React / Vite frontend — Vite dev server with HMR ───────────────────────
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: frontend_dev
    restart: unless-stopped
    volumes:
      - ./frontend:/app                  # mount source for HMR
      - /app/node_modules                # keep container's node_modules isolated
    ports:
      - "3000:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true         # needed on some host/OS combos
      - VITE_API_URL=http://localhost:8000/api
      - VITE_WS_URL=ws://localhost:8000
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

volumes:
  postgres_data_dev:
  static_volume_dev:
  media_volume_dev:
