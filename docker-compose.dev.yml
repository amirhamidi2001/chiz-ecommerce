# ─── docker-compose.dev.yml ───────────────────────────────────────────────────
# Development stack: hot reload, mounted source, console email, debug mode.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15
    container_name: backend_db_dev
    restart: unless-stopped
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7
    container_name: backend_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django backend — Django dev server with hot reload ──────────────────────
  backend:
    build:
      context: ./backend
      target: development
    container_name: backend_dev
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app                   # mount source for hot reload
      - static_volume_dev:/app/staticfiles
      - media_volume_dev:/app/media
    env_file:
      - .env.dev
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery worker — processes queued background tasks ──────────────────────
  # NOTE: mounts media_volume_dev like the backend service, since some
  # queued tasks may need to read/write media files. (No such task exists
  # in this codebase yet as of this task — there is currently no
  # tasks.py anywhere in the project, so nothing is actually queued —
  # but this is a low-cost, forward-looking inclusion for whenever one
  # is added.)
  celery_worker:
    build:
      context: ./backend
      target: development
    container_name: backend_celery_worker_dev
    restart: unless-stopped
    command: celery -A core worker --loglevel=info
    volumes:
      - ./backend:/app
      - media_volume_dev:/app/media
    env_file:
      - .env.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  # ── Celery beat — schedules periodic tasks ──────────────────────────────────
  # depends_on backend (service_started, not service_healthy — backend has
  # no healthcheck defined in this file) so migrations have at least been
  # INITIATED before beat starts looking for PeriodicTask rows. NOTE: as of
  # this task, no periodic-task-seeding migration exists in this codebase
  # (no payments/shipping/notifications apps or tasks.py exist yet to seed
  # tasks for) — this dependency ordering is still the correct structural
  # choice for whenever seeded schedules are added.
  celery_beat:
    build:
      context: ./backend
      target: development
    container_name: backend_celery_beat_dev
    restart: unless-stopped
    command: celery -A core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    env_file:
      - .env.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  # ── React / Vite frontend — Vite dev server with HMR ───────────────────────
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: frontend_dev
    restart: unless-stopped
    volumes:
      - ./frontend:/app                  # mount source for HMR
      - /app/node_modules                # keep container's node_modules isolated
    ports:
      - "3000:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true         # needed on some host/OS combos
      - VITE_API_URL=http://localhost:8000/api
      - VITE_WS_URL=ws://localhost:8000
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

volumes:
  postgres_data_dev:
  static_volume_dev:
  media_volume_dev:
