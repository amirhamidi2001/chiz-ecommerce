<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome - Chiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gradient-to-br from-teal-50 via-white to-emerald-50 min-h-screen flex items-center justify-center font-sans">
    <div class="w-full max-w-xl bg-white shadow-xl rounded-2xl border border-teal-100 overflow-hidden">
      <!-- Header -->
      <div class="bg-gradient-to-r from-teal-600 to-emerald-500 p-6 text-white text-center">
        <h1 class="text-2xl font-bold tracking-wide">Welcome to Chiz</h1>
        <p class="text-sm opacity-90 mt-1">Your journey starts here</p>
      </div>

      <!-- Body -->
      <div class="p-8 space-y-4 text-gray-700">
        <p class="text-lg">
          Hi <span class="font-semibold text-teal-700">{{ first_name }}</span>,
        </p>

        <p>
          Thank you for registering with <span class="font-semibold text-emerald-600">Chiz</span>. We’re excited to have you on board.
        </p>

        <p>Your account is now ready, and you can start exploring all the features we’ve built for you.</p>

        <!-- Call to action -->
        <div class="pt-4">
          <a href="#" class="inline-block px-6 py-3 rounded-lg bg-teal-600 text-white font-medium hover:bg-teal-700 transition shadow-md">Get Started</a>
        </div>
      </div>

      <!-- Footer -->
      <div class="bg-gray-50 px-6 py-4 text-center text-xs text-gray-500 border-t border-gray-100">© 2026 Chiz. All rights reserved.</div>
    </div>
  </body>
</html>
