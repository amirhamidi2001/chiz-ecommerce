[pytest]
# ─── backend/pytest.ini ───────────────────────────────────────────────────────
# Root-level pytest config. Individual app-level pytest.ini files are ignored
# once this root config is present (pytest uses the first one it finds going up).

DJANGO_SETTINGS_MODULE = core.settings.development

python_files = test_*.py tests.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto

addopts =
    --reuse-db
    --tb=short
    -q

# Silence noisy deprecation warnings from third-party libs
filterwarnings =
    ignore::DeprecationWarning:pkg_resources
    ignore::DeprecationWarning:channels
