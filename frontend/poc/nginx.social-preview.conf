# EXPLORATORY PROOF OF CONCEPT (Task 15.1.2.3 spike): NOT wired into the real nginx.conf and
# NOT production-ready. See frontend/docs/prerendering-evaluation.md.
#
# Idea: link-preview crawlers (Telegram, WhatsApp, Facebook, ...) fetch raw HTML and run no
# JavaScript, so they never see the Open Graph tags the SPA injects with react-helmet-async.
# For product URLs only, requests whose User-Agent is on a short allowlist of such crawlers are
# answered by a tiny Django page (backend: shop/social_preview.py) that carries the tags.
# EVERYONE ELSE (browsers, Googlebot, Bing, anything unknown) gets the normal SPA shell, so
# nothing changes for users and search engines still render the real page (no cloaking: the
# snippet states the same title / description / image / price the page shows).
#
# This file is the content of /etc/nginx/conf.d/default.conf (http context), replacing
# frontend/nginx.conf, with the same SPA behaviour plus the product-route rule below.

# Crawlers that build link previews. Substring, case-insensitive: Telegram sends both
# "TelegramBot (like TwitterBot)" and "TelegramBot/1.0 like Linux"; WhatsApp sends
# "WhatsApp/2.x.x.x A|I|N". Deliberately NOT listed: Googlebot, Bingbot, Applebot (search
# engines that render JavaScript). Iranian messengers (Bale, Eitaa, Rubika, Soroush Plus) do not
# publish their crawlers' User-Agents: collect them from the access log (see the evaluation, 8.3)
# and add them here.
map $http_user_agent $social_preview_bot {
    default 0;
    "~*(TelegramBot|WhatsApp|facebookexternalhit|Facebot|Twitterbot|LinkedInBot|Slackbot|Discordbot|SkypeUriPreview|Viber|vkShare|Pinterestbot)" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, so nginx still starts if `backend` is not resolvable yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # /product/<slug> (also with a trailing slash)
    location ~ ^/product/(?<slug>[^/]+)/?$ {
        # The same URL now returns different HTML depending on the User-Agent: tell any cache
        # (CDN, proxy) so it cannot serve the crawler snippet to browsers or the SPA to crawlers.
        add_header Vary "User-Agent" always;

        # `rewrite ... last` (and `return`) are the only constructs nginx documents as safe
        # inside `if`. Rewriting to an internal location, instead of chaining error_page
        # redirects, keeps the preview location's own error_page fallback working.
        if ($social_preview_bot) { rewrite ^ /__social_preview/$slug last; }

        # Not `/index.html`: an internal redirect would drop the Vary header above.
        try_files $uri @spa_shell;
    }

    location ~ ^/__social_preview/(?<preview_slug>.+)$ {
        internal;   # unreachable from outside; only via the rewrite above
        add_header Vary "User-Agent" always;

        set $preview_backend "backend:8000";   # compose service name; Daphne listens on 8000
        # Crawlers give up fast (WhatsApp's timeout is short): fail over to the SPA quickly.
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        proxy_set_header Host $preview_backend;
        proxy_pass http://$preview_backend/share/product/$preview_slug;

        # Unknown product (404), backend error or timeout: serve the normal SPA shell instead
        # of an error page, i.e. exactly what happens today without this PoC.
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @spa_shell;
    }

    location @spa_shell {
        add_header Vary "User-Agent" always;
        rewrite ^ /index.html break;
    }

    # Everything else: the unchanged SPA behaviour from frontend/nginx.conf.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
